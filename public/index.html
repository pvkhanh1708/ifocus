    <title>iFocus</title>
    <meta name="description" content="Hẹn giờ Pomodoro, âm thanh thiên nhiên, ghi chú, checklist và đếm ngược trong một không gian tập trung." />
    <!-- PWA: files in src/public are copied as-is to the web root on build -->
    <meta name="theme-color" content="#09101e" />
    <script>
      // Status bar / page colour = top edge of the last scene, set before the
      // first paint (iOS may take the colour at launch). See sceneEdgeColor.ts.
      (function () {
        try {
          var c = localStorage.getItem("ifocus-scene-edge");
          if (!c || !/^(#[0-9a-f]{3,8}|rgba?\([^)]*\))$/i.test(c)) return;
          var r = document.documentElement;
          r.style.backgroundColor = c;
          r.style.setProperty("--scene-edge", c);
          document.querySelector("meta[name=theme-color]").setAttribute("content", c);
        } catch (e) {}
      })();
    </script>
